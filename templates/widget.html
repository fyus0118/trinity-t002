<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SINGULARITY // DUAL MONITOR (RESPONSIVE)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;900&family=Noto+Sans+JP:wght@900&family=Teko:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --void-bg: #030305;
            --blood-neon: #ff1133;
            --cyan-neon: #00ffcc;
            --pure-light: #ffffff;
            --glass-bg: rgba(10, 5, 5, 0.4);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--void-bg); color: var(--pure-light);
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            /* スマホでの縦スクロールを許可しつつ、余分な横揺れを防ぐ */
            overflow-x: hidden; overflow-y: auto;
            perspective: 1200px;
            transition: background-color 0.1s;
        }

        /* 背景パーティクルはスクロールしても固定 */
        #particle-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;
        }

        /* パネルを並べるコンテナ */
        .dual-scene {
            position: relative; width: 100%; min-height: 100%;
            display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 40px;
            z-index: 10; transform-style: preserve-3d;
            padding: 40px; box-sizing: border-box;
        }

        .hologram-card {
            position: relative; flex: 1; max-width: 600px; height: 75vh; min-height: 600px;
            padding: 50px 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            transform-style: preserve-3d; transition: transform 0.1s ease-out;
            pointer-events: auto; display: flex; flex-direction: column; justify-content: center;
        }

        .layer-deep { transform: translateZ(20px); }
        .layer-mid { transform: translateZ(50px); }
        .layer-front { transform: translateZ(90px); }

        /* ==================== 左パネル ==================== */
        .card-alert {
            border: 1px solid rgba(255, 17, 51, 0.2);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 0 40px rgba(255, 17, 51, 0.1);
        }
        .system-warning {
            font-family: 'Teko', sans-serif; font-size: 2rem; letter-spacing: 8px;
            color: var(--blood-neon); text-align: center; text-transform: uppercase;
            text-shadow: 0 0 20px var(--blood-neon); margin-bottom: 15px;
        }
        .target-task {
            font-size: clamp(1.8rem, 3vw, 3rem); font-weight: 900; line-height: 1.2;
            text-align: center; margin: 0 0 30px 0; word-break: keep-all;
            background: linear-gradient(to right, #fff, #ffaaaa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .debt-container {
            text-align: center; margin-bottom: 30px; padding: 10px;
            border-top: 1px solid rgba(255,17,51,0.3); border-bottom: 1px solid rgba(255,17,51,0.3);
            background: rgba(255, 0, 0, 0.05);
        }
        .debt-label { font-size: 0.8rem; letter-spacing: 4px; color: #aaa; }
        .debt-value { font-family: 'Teko', sans-serif; font-size: 3.5rem; font-weight: 600; color: var(--blood-neon); line-height: 1; }
        
        .antidote-box {
            background: var(--pure-light); color: var(--void-bg);
            padding: 20px 30px; border-radius: 12px; text-align: center;
            box-shadow: 0 20px 40px rgba(255, 255, 255, 0.2);
        }
        .antidote-label { font-size: 0.85rem; font-weight: 900; letter-spacing: 2px; color: #555; margin-bottom: 5px; display: block; }
        .command-text { font-size: 1.5rem; font-weight: 900; line-height: 1.4; }

        /* ==================== 右パネル ==================== */
        .card-normal {
            border: 1px solid rgba(0, 255, 204, 0.2);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 0 40px rgba(0, 255, 204, 0.05);
        }
        .zen-circle {
            width: 250px; height: 250px; border-radius: 50%; margin: 20px auto;
            border: 1px solid rgba(0, 255, 204, 0.3);
            box-shadow: inset 0 0 50px rgba(0, 255, 204, 0.1), 0 0 80px rgba(0, 255, 204, 0.1);
            animation: pulse-zen 4s infinite alternate ease-in-out;
            display: flex; justify-content: center; align-items: center; position: relative;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        .zen-circle:hover, .zen-circle:active {
            transform: scale(1.05) translateZ(50px);
            box-shadow: inset 0 0 80px rgba(0, 255, 204, 0.3), 0 0 100px rgba(0, 255, 204, 0.3);
        }
        .zen-inner {
            position: absolute; width: 170px; height: 170px; border-radius: 50%;
            border: 2px dashed rgba(0, 255, 204, 0.5);
            animation: spin-slow 20s linear infinite;
        }
        .timer-display {
            font-family: 'Teko', sans-serif; font-size: 4.5rem; font-weight: 600;
            color: var(--cyan-neon); text-shadow: 0 0 15px var(--cyan-neon);
            z-index: 2; line-height: 1; pointer-events: none;
        }
        .timer-label {
            position: absolute; bottom: 40px; font-size: 0.75rem; color: rgba(0,255,204,0.7);
            letter-spacing: 3px; z-index: 2; font-weight: bold; pointer-events: none;
        }
        .flow-text {
            text-align: center; color: var(--pure-light);
            font-size: 1.5rem; letter-spacing: 2px;
            font-family: 'Noto Sans JP', sans-serif; font-weight: 900;
        }

        @keyframes pulse-zen { 0% { opacity: 0.8; } 100% { opacity: 1; } }
        @keyframes spin-slow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ==================== スマホ用補正 (レスポンシブ) ==================== */
        @media (max-width: 900px) {
            .dual-scene {
                flex-direction: column; /* 縦並びに変更 */
                padding: 20px;
                gap: 30px;
            }
            .hologram-card {
                width: 100%; height: auto; min-height: 60vh;
                padding: 40px 20px;
            }
            .system-warning { font-size: 1.5rem; letter-spacing: 4px; }
            .target-task { font-size: 1.8rem; }
            .debt-value { font-size: 2.8rem; }
            .command-text { font-size: 1.2rem; }
            
            .zen-circle { width: 200px; height: 200px; }
            .zen-inner { width: 140px; height: 140px; }
            .timer-display { font-size: 3.5rem; }
            .timer-label { bottom: 30px; font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="dual-scene">
        <div class="hologram-card card-alert">
            <div class="system-warning layer-deep">TEMPORAL ANOMALY DETECTED</div>
            <h1 class="target-task layer-mid">[ AWAITING API UPLINK ]</h1>
            <div class="debt-container layer-deep">
                <div class="debt-label">SUNK COST DEBT (MS)</div>
                <div class="debt-value" id="debt-counter">7200000</div>
            </div>
            <div class="antidote-box layer-front">
                <span class="antidote-label">AI MICRO-RESOLUTION [ 5 MIN ]</span>
                <div class="command-text">
                    <span id="raw-command" style="display:none;">CONNECTING TO OPENAI SECURE SERVER... STANDBY FOR DIRECTIVE.</span>
                    <span id="typewriter-output"></span>
                </div>
            </div>
        </div>

        <div class="hologram-card card-normal">
            <div class="layer-deep" style="position: absolute; top: 20px; right: 20px; color: var(--cyan-neon); font-family: 'Teko'; letter-spacing: 2px;">
                SYS.NODE: SECURE
            </div>
            <div class="layer-mid" style="text-align: center; margin-bottom: 10px; margin-top: 20px;">
                <div style="font-size: 0.85rem; color: #888; letter-spacing: 4px; font-weight: bold;">TARGETS ELIMINATED TODAY</div>
                <div style="font-size: 3rem; font-family: 'Teko'; font-weight: 600; color: var(--cyan-neon); text-shadow: 0 0 15px var(--cyan-neon); line-height: 1;">04</div>
            </div>
            <div class="zen-circle layer-mid" id="tactical-timer">
                <div class="zen-inner" id="zen-inner-spin"></div>
                <div class="timer-display" id="timer-text">05:00</div>
                <div class="timer-label" id="timer-label">TAP TO INITIATE</div>
            </div>
            <div class="flow-text layer-front" style="margin-top: 10px;">
                <span style="font-size: 0.8rem; color: #888; letter-spacing: 4px; display:block; margin-bottom:5px;">NEXT QUEUED TARGET</span>
                [ DATA ENCRYPTED ]
            </div>
        </div>
    </div>

    <script>
        // --- 1. マウス＆スマホの指に連動する3Dホログラム ---
        const cards = document.querySelectorAll('.hologram-card');
        
        function handleMove(e) {
            // タッチ（指）かマウスかを判定して座標を取得
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;

            let xAxis = (window.innerWidth / 2 - clientX) / 35;
            let yAxis = (window.innerHeight / 2 - clientY) / 35;
            
            cards.forEach(card => {
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });

            // 背景パーティクルのための座標更新
            mouse.x = clientX;
            mouse.y = clientY;
        }

        function handleLeave() {
            cards.forEach(card => {
                card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            });
            mouse.x = -1000;
            mouse.y = -1000;
        }

        // PC用マウスイベント
        document.addEventListener('mousemove', handleMove);
        document.addEventListener('mouseleave', handleLeave);
        // スマホ用タッチイベント
        document.addEventListener('touchmove', handleMove, {passive: true});
        document.addEventListener('touchend', handleLeave);

        // --- 2. 超高速カウンター ---
        const counterEl = document.getElementById('debt-counter');
        let msDebt = 7200000;
        setInterval(() => {
            msDebt += 17;
            counterEl.innerText = msDebt.toLocaleString('en-US');
        }, 17);

        // --- 3. タイプライター ---
        setTimeout(() => {
            const text = document.getElementById("raw-command").innerText;
            const output = document.getElementById("typewriter-output");
            let i = 0;
            function type() {
                if (i < text.length) {
                    output.innerHTML += text.charAt(i); i++;
                    setTimeout(type, 30);
                }
            }
            type();
        }, 800);

        // --- 4. 5分タイマーと爆発エフェクト ---
        let timerRunning = false;
        let timeLeft = 300;
        const timerBtn = document.getElementById('tactical-timer');
        const timerText = document.getElementById('timer-text');
        const timerLabel = document.getElementById('timer-label');
        const zenInner = document.getElementById('zen-inner-spin');

        timerBtn.addEventListener('click', () => {
            if (timerRunning) return;
            timerRunning = true;
            
            timerText.style.color = '#ffaa00';
            timerText.style.textShadow = '0 0 20px #ffaa00';
            timerLabel.innerText = 'TACTICAL ENGAGEMENT';
            timerLabel.style.color = '#ffaa00';
            zenInner.style.animationDuration = '2s';
            zenInner.style.borderColor = '#ffaa00';

            const countdown = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                let s = (timeLeft % 60).toString().padStart(2, '0');
                timerText.innerText = `${m}:${s}`;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerText.innerText = "00:00";
                    triggerExplosion();
                }
            }, 1000);
        });

        function triggerExplosion() {
            // --- 【付け足し1】スマホ用バイブレーション (物理ショック) ---
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

            document.body.style.backgroundColor = "var(--blood-neon)";
            setTimeout(() => document.body.style.backgroundColor = "var(--pure-light)", 100);
            setTimeout(() => document.body.style.backgroundColor = "var(--blood-neon)", 200);
            setTimeout(() => document.body.style.backgroundColor = "var(--void-bg)", 400);

            timerText.style.color = 'var(--blood-neon)';
            timerText.style.textShadow = '0 0 30px var(--blood-neon)';
            timerText.innerText = "K.O.";
            timerLabel.innerText = 'TARGET ELIMINATED';
            timerLabel.style.color = 'var(--blood-neon)';
            zenInner.style.borderColor = 'var(--blood-neon)';

            particles.forEach(p => {
                p.x = (Math.random() - 0.5) * width * 3;
                p.y = (Math.random() - 0.5) * height * 3;
                p.z = Math.random() * 50;
                p.color = `rgba(255, 30, 30, `;
                p.size = Math.random() * 8 + 4;
            });
        }

        // --- 5. インタラクティブ・パーティクル ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let mouse = { x: -1000, y: -1000 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = (Math.random() - 0.5) * width * 2;
                this.y = (Math.random() - 0.5) * height * 2;
                this.z = Math.random() * 1000;
                this.size = Math.random() * 2 + 0.5;
                this.color = null;
            }
            update() {
                this.z -= 2;
                if (this.z <= 0) this.reset();

                let fov = 300;
                let scale = fov / (fov + this.z);
                let x2d = this.x * scale + width / 2;
                let y2d = this.y * scale + height / 2;

                let dx = x2d - mouse.x;
                let dy = y2d - mouse.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 150) {
                    this.x += dx * 0.05; this.y += dy * 0.05;
                }

                ctx.beginPath();
                ctx.arc(x2d, y2d, this.size * scale, 0, Math.PI * 2);
                
                if (this.color && this.color.includes("255, 30, 30")) {
                    ctx.fillStyle = this.color + (1 - this.z/1000) + ")";
                } else {
                    if (x2d < width / 2) {
                        ctx.fillStyle = `rgba(255, ${Math.random()*50}, ${Math.random()*50}, ${(1 - this.z/1000)})`;
                    } else {
                        ctx.fillStyle = `rgba(0, ${150+Math.random()*105}, 255, ${(1 - this.z/1000)})`;
                    }
                }
                ctx.fill();
            }
        }

        for (let i = 0; i < 400; i++) { particles.push(new Particle()); }

        function animate() {
            ctx.fillStyle = 'rgba(3, 3, 5, 0.2)';
            ctx.fillRect(0, 0, width, height);
            particles.forEach(p => p.update());
            requestAnimationFrame(animate);
        }
        animate();

        // --- 【付け足し2】ホログラフィック・ティルト (3D視差効果) ---
        const targetUI = document.getElementById('tactical-timer');
        if (targetUI) {
            document.addEventListener('mousemove', (e) => {
                let xAxis = (window.innerWidth / 2 - e.pageX) / 40;
                let yAxis = (window.innerHeight / 2 - e.pageY) / 40;
                targetUI.style.transform = `perspective(1000px) rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
            document.addEventListener('mouseleave', () => {
                targetUI.style.transition = 'transform 0.5s ease';
                targetUI.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg)`;
                setTimeout(() => targetUI.style.transition = '', 500);
            });
        }
    </script>
</body>
</html>
