<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        /* Cyberpunk styling */
        body { 
            background-color: #191919; 
            color: #e0e0e0; 
            font-family: 'Courier New', monospace; 
            margin: 0; padding: 0; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden;
        }
        .container { 
            width: 100%; height: 100%; 
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            text-align: center;
        }

        /* --- NORMAL MODE (Green) --- */
        .normal .status-icon { font-size: 24px; margin-bottom: 5px; }
        .normal h1 { color: #2ecc71; font-size: 14px; letter-spacing: 2px; margin: 0; }
        .normal p { font-size: 10px; color: #555; margin-top: 5px; }

        /* --- ALERT MODE (Red) --- */
        .alert { 
            border: 1px solid #e74c3c; 
            background: rgba(231, 76, 60, 0.1);
            animation: flashRed 2s infinite alternate;
        }
        .alert h1 { color: #e74c3c; font-size: 12px; margin: 0 0 5px 0; text-transform: uppercase; }
        .alert .cmd { color: #fff; font-size: 14px; font-weight: bold; margin-bottom: 10px; padding: 0 10px; }
        
        /* Interactive Button */
        .btn { 
            background: #e74c3c; color: #000; border: none; 
            padding: 8px 20px; font-size: 12px; font-weight: 800; cursor: pointer; 
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            transition: 0.2s;
        }
        .btn:hover { background: #fff; transform: scale(1.05); }

        /* Timer Display */
        .timer-box { display: none; }
        .timer { font-size: 40px; font-weight: bold; color: #e74c3c; font-family: monospace; }
        .timer-msg { font-size: 10px; color: #888; }

        @keyframes flashRed { 
            0% { box-shadow: inset 0 0 0px rgba(231, 76, 60, 0); } 
            100% { box-shadow: inset 0 0 20px rgba(231, 76, 60, 0.3); } 
        }
    </style>
    <script>
        function startBreach() {
            document.getElementById('alert-content').style.display = 'none';
            document.getElementById('timer-box').style.display = 'block';
            
            let timeLeft = 300; // 5 minutes
            const display = document.getElementById('timer-display');
            
            const interval = setInterval(() => {
                const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                const s = (timeLeft % 60).toString().padStart(2, '0');
                display.innerText = m + ":" + s;
                timeLeft--;

                if (timeLeft < 0) {
                    clearInterval(interval);
                    display.innerText = "DONE";
                    display.style.color = "#2ecc71";
                    document.getElementById('timer-msg').innerText = "SYSTEM SYNCED.";
                }
            }, 1000);
        }
    </script>
</head>
<body class="{{ mode }}">
    <div class="container {{ mode }}">
        
        {% if mode == "normal" %}
            <div class="status-icon">👁️</div>
            <h1>SYSTEM ACTIVE</h1>
            <p>Scanning Task Matrix...</p>
        
        {% else %}
            <div id="alert-content">
                <h1>⚠️ STAGNATION: {{ task_name }}</h1>
                <div class="cmd">"{{ command }}"</div>
                <button class="btn" onclick="startBreach()">⚡ EXECUTE (5 MIN)</button>
            </div>

            <div id="timer-box" class="timer-box">
                <div class="timer" id="timer-display">05:00</div>
                <div class="timer-msg" id="timer-msg">JUST START. DO NOT FINISH.</div>
            </div>
        {% endif %}

    </div>
</body>
</html>
